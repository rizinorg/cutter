name: "Linter"

on:
  push:
    branches:
    - dev
    - stable
  pull_request:
    branches:
    - dev
    - stable

env:
  LLVM_VERSION: 20
  USE_APT_LLVM_ORG: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      clang-format: ${{ steps.filter.outputs.clang-format }}
    steps:
    - uses: actions/checkout@v7
    - uses: dorny/paths-filter@v2
      id: filter
      with:
        filters: |
          clang-format:
            - '**.cpp'
            - '**.c'
            - '**.h'
            - '.github/workflows/linter.yml'
            - 'scripts/clang-format.py'
            - '_clang-format'

  clang-format:
    needs: changes
    runs-on: ubuntu-latest
    if: ${{ needs.changes.outputs.clang-format == 'true' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install wget, software-properties-common, lsb-release (dependencies of LLVM install script)
      if: ${{ env.USE_APT_LLVM_ORG == 'true' }}
      run: sudo apt --assume-yes install wget software-properties-common lsb-release

    - name: Uninstall old conflicting packages
      if: ${{ env.USE_APT_LLVM_ORG == 'true' }}
      run: |
        pkgs=$(dpkg-query -W -f='${db:Status-Abbrev} ${Package}\n' 'llvm' 'llvm-[0-9]*' 'python3-lldb-[0-9]*' 2>/dev/null \
          | awk '$1 == "ii" {print $2}' | grep -v -- "-${LLVM_VERSION}$" || true)
        if [ -n "$pkgs" ]; then
          sudo apt-get purge --assume-yes --auto-remove $pkgs
        fi

    - name: Install automatic LLVM ${{ env.LLVM_VERSION }}
      if: ${{ env.USE_APT_LLVM_ORG == 'true' }}
      run: wget https://apt.llvm.org/llvm.sh -O /tmp/llvm-install.sh; chmod +x /tmp/llvm-install.sh; sudo /tmp/llvm-install.sh "$LLVM_VERSION"

    - name: Install clang-format-${{ env.LLVM_VERSION }}
      run: |
        sudo apt-get install --assume-yes "clang-format-$LLVM_VERSION"

    - name: Install gitpython
      run: sudo pip install gitpython

    - name: Run clang-format
      run: |
        sudo update-alternatives --install /usr/bin/clang-format clang-format "/usr/bin/clang-format-$LLVM_VERSION" 200
        clang-format --version
        python scripts/clang-format.py --check --verbose

  clang-tidy:
    needs: changes
    # if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install Build Dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential cmake ninja-build meson \
          qt6-base-dev qt6-tools-dev \
          qt6-tools-dev-tools libqt6svg6-dev libqt6core5compat6-dev \
          libqt6svgwidgets6 qt6-l10n-tools \
          libgl1-mesa-dev libglu1-mesa-dev 

    - name: Install automatic LLVM ${{ env.LLVM_VERSION }}
      if: ${{ env.USE_APT_LLVM_ORG == 'true' }}
      run: wget https://apt.llvm.org/llvm.sh -O /tmp/llvm-install.sh; chmod +x /tmp/llvm-install.sh; sudo /tmp/llvm-install.sh "$LLVM_VERSION"

    - name: Install clang-tidy-${{ env.LLVM_VERSION }}
      run: |
        sudo apt-get install --assume-yes "clang-tidy-$LLVM_VERSION"

    - name: CMake Configuration
      run: |
        cmake -S . -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCUTTER_QT=6 \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Run autogen
      run: |
        cmake --build build --target Cutter_autogen

    - name: Run Clang-Tidy
      run: |
        sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy "/usr/bin/clang-tidy-$LLVM_VERSION" 200
        sudo update-alternatives --install /usr/bin/run-clang-tidy run-clang-tidy "/usr/bin/run-clang-tidy-$LLVM_VERSION" 200
        clang-tidy -version
        python3 scripts/clang-tidy.py
